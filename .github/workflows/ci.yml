name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v5/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Compile all modules
        run: python -m compileall app tools -q
      - name: Run unit tests (isolated data root; fail-closed)
        env:
          PYTHONIOENCODING: utf-8
        run: python tools/run_tests_isolated.py

  frontend:
    name: Frontend type-check & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v5/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install
      - name: Type check (vue-tsc)
        run: npx vue-tsc -b
      - name: Production build
        run: npm run build
